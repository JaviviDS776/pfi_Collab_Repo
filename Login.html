<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Form</title>
  <style>

/* Contenedor principal ocupa siempre toda la ventana,
pero mantiene un máximo para pantallas muy grandes */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: #f5f5f5;
  animation: fadeIn 1s forwards;
}

/* Contenedor principal ocupa siempre toda la ventana,
   pero mantiene un máximo para pantallas muy grandes */
.container {
  flex: 1;
  display: flex;
  width: 100vw;
  min-height: 100vh;
  width: 1200px;
  background: #F5F4D0;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
}

/* Dos columnas iguales */
.left-side, .right-side {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px;
  min-height: 100vh;
}

/* Estilo especial de la izquierda */
.left-side {
  background: linear-gradient(210deg, #F5DE70, #D1E1BF);
  border-radius: 0 100px 100px 0;
  text-align: center;
}

/* título y textos */
h1 {
  font-size: 32px;
  margin-bottom: 30px;
  color: #333;
  text-align: center;
}

.welcome-text {
  font-size: 36px;
  font-weight: bold;
  margin-bottom: 10px;
  color: #333;
  text-align: center;
}

.account-text {
  font-size: 14px;
  margin-bottom: 20px;
  color: #333;
  text-align: center;
}

/* formulario */
.form-group {
  width: 100%;
  max-width: 400px;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 5px;
  color: #333;
}

input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 10px;
  border: 2px solid transparent;
  background-color: rgba(255,255,255,0.5);
  border-radius: 50px;
  outline: none;
  box-shadow: rgba(0,0,0,0.089) 0px 5px 15px;
  transition: all 0.3s ease;
}

input:focus {
  border-color: #aed6a3;
  outline: none;
}

/* checkbox */
.checkbox-group {
  display: flex;
  align-items: center;
  margin-top: 10px;
  margin-bottom: 20px;
}

.checkbox-group label {
  margin-left: 5px;
  font-size: 14px;
}

.forgot-password {
  text-align: right;
  margin-bottom: 20px;
  font-size: 14px;
}

/* botón register */
button {
  width: 100%;
  padding: 12px;
  background-color: #f9e79f;
  border: none;
  border-radius: 10px;
  color: #333;
  font-size: bold;
  cursor: pointer;
  transition: background-color 0.3s;
}
button:hover {
  background-color: #f7dc6f;
}

/* link a login */
.register-btn {
  display: block;
  text-align: center;
  padding: 12px;
  background-color: #F5F4D0;
  width: 80%;
  border: none;
  border-radius: 10px;
  color: #333;
  font-weight: bold;
  cursor: pointer;
  transition: background-color 0.3s;
  text-decoration: none;
}

.register-btn:hover {
  background-color: #f3bf6c;
}

/* error fijo */
.error-message {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background-color: #ff4d4f;
  color: white;
  padding: 1rem;
  max-width: 80%;
  width: auto;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  z-index: 1000;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.error-message span:first-child {
  margin-right: 0.5rem;
}
.error-message .close-btn {
  cursor: pointer;
  font-size: 1.5rem;
  font-weight: bold;
  color: white;
  background: none;
  border: none;
  padding-left: 10px;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@media (max-width: 768px) {
  .container {
    flex-direction: column;
    min-height: 100vh;
    border-radius: 0;
  }

  .right-side {
    min-height: 60vh;
    justify-content: center;
  }

  .left-side {
    border-radius: 0px 0px 100px 100px;
    min-height: 40vh;
    justify-content: center;
  }

  h1 {
    font-size: 24px;
  }

  .welcome-text {
    font-size: 28px;
  }

  .account-text,
  label,
  .forgot-password,
  .checkbox-group label {
    font-size: 12px;
  }

  input {
    padding: 8px;
  }

  button,
  .register-btn {
    padding: 10px;
    font-size: 14px;
  }
}
  </style>
</head>
<body>

  <!-- Eliminado el código EJS -->
  <!-- Puedes añadir aquí un mensaje fijo si quieres -->
  <!-- <div class="error-message">
    <div>
      <span>¡Error!</span>
      <p>Mensaje de error de ejemplo</p>
    </div>
  </div> -->

  <div class="container">
    <div class="left-side">
      <div class="welcome-text">Welcome Back!</div>
      <div class="account-text">Don't have an account?</div>
      <a href="/register" class="register-btn" id="register-btn">Register</a>
    </div>

    <div class="right-side">
      <div class="welcome-text">Login</div>
      <div class="user-icon">
        <!-- Imagen SVG o ícono -->
        <!-- Puedes reemplazar o eliminar el SVG base64 largo si no lo necesitas -->
        <svg width="100" height="100" viewBox="0 0 100 100" fill="gray" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="30" r="20"/>
          <rect x="25" y="60" width="50" height="30" rx="15"/>
        </svg>
      </div>

      <form style="width: 100%; max-width: 400px;">
        <div class="form-group">
          <label for="username">User:</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required/>
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="remember" />
          <label for="remember">Remember me</label>
        </div>

        <div class="forgot-password">
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit">Login</button>
      </form>
    </div>
  </div>
</body>
</html>
